<ion-tabs (ionTabsDidChange)="onTabChange($any($event))">
  <ion-tab tab="home" class="home-tab-page">
    <ion-router-outlet></ion-router-outlet>
  </ion-tab>
    <ion-tab tab="residents">
      <div id="residents-page">
        <ion-header>
          <ion-toolbar>
            <ion-buttons slot="start">
              <ion-button color="outlined">
                <span class="mat-icon">clear_all</span>
              </ion-button>
            </ion-buttons>
            <ion-title>Residentes</ion-title>
            <ion-buttons slot="end">
              <ion-button color="outlined">
                <span class="mat-icon">account_circle</span>
              </ion-button>
            </ion-buttons>
          </ion-toolbar>
        </ion-header>

        <app-residents />
      </div>
    </ion-tab>
    <ion-tab tab="data">
      <div id="data-page">
        <ion-header>
          <ion-toolbar>
            <ion-title>Library</ion-title>
          </ion-toolbar>
        </ion-header>
        <ion-content>
          <div class="example-content">Library content</div>
        </ion-content>
      </div>
    </ion-tab>
    <ion-tab tab="measures">
      <div id="measures-page">
        <ion-header>
          <ion-toolbar>
            <ion-title>Search</ion-title>
          </ion-toolbar>
        </ion-header>
        <ion-content>
          <div class="example-content">Search content</div>
        </ion-content>
      </div>
    </ion-tab>

    <ion-tab-bar slot="bottom" [class.home-tab]="currentTab === 'home'">
      <ion-tab-button tab="home">
        <span class="mat-icon">home</span>
      </ion-tab-button>
      <ion-tab-button tab="residents">
        <!-- diario -->
        <span class="mat-icon">view_timeline</span>
      </ion-tab-button>
      <ion-tab-button tab="data">
        <!-- tareas -->
        <span class="mat-icon">checklist</span>
      </ion-tab-button>
      <ion-tab-button tab="measures">
        <!-- toma de datos -->
        <span class="mat-icon">stacked_line_chart</span>
      </ion-tab-button>
    </ion-tab-bar>
</ion-tabs>
