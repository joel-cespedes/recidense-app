<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button color="outlined">
        <span class="mat-icon">clear_all</span>
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button color="outlined">
        <span class="mat-icon">account_circle</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-button expand="block">
    <span class="mat-icon">pan_tool_alt</span>
    <span class="label">Manual</span>
  </ion-button>

  <ion-button expand="block">
    <span class="mat-icon">keyboard_voice</span>
    <span class="label">Grabación por voz</span>
  </ion-button>

  <ion-button expand="block">
    <span class="mat-icon">event_repeat</span>
    <span class="label">Ver historial</span>
  </ion-button>
</ion-content>
