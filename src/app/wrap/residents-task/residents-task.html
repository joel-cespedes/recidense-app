<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button color="outlined">
        <span class="mat-icon">clear_all</span>
      </ion-button>
    </ion-buttons>

    <ion-buttons slot="end">
      <ion-button color="outlined">
        <span class="mat-icon">account_circle</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="title-section center m-b-32">Tareas</div>
  <div class="container p-t-32 m-t-32">
    <ion-button class="selection" color="primary" expand="block" (click)="navigateToTask()">
      <span class="mat-icon">checklist</span>
      <span class="label">Ver tareas</span>
    </ion-button>
    <ion-button class="selection" color="primary" expand="block" (click)="navigateToManual()">
      <span class="mat-icon">pan_tool_alt</span>
      <span class="label">Asignación manual</span>
    </ion-button>

    <ion-button class="selection" color="primary" expand="block" (click)="navigateToVoice()">
      <span class="mat-icon">keyboard_voice</span>
      <span class="label">Asignación por voz</span>
    </ion-button>

    <ion-button class="selection" color="primary" expand="block" (click)="navigateToHistory()">
      <span class="mat-icon">event_repeat</span>
      <span class="label">Ver historial</span>
    </ion-button>

    <ion-button class="selection" color="primary" expand="block" (click)="navigateToHistory()">
      <span class="mat-icon">event_repeat</span>
      <span class="label">Ver historial por residente</span>
    </ion-button>
  </div>
</ion-content>
