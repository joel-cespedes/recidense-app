<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <span class="mat-icon">arrow_back</span>
      </ion-button>
    </ion-buttons>
    <ion-title>Seleccionar Residencia</ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <span class="mat-icon">add</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-toolbar>
    <ion-searchbar placeholder="Buscar residencia..."></ion-searchbar>
  </ion-toolbar>
  <ion-list>
    @for (residence of residences; track residence.id) {
    <ion-item (click)="selectResidence(residence)">
      <ion-label>
        <ion-avatar slot="start">
          <span class="mat-icon">diversity_1</span>
        </ion-avatar>
        <div class="info-residence">
          <h2>{{ residence.name }}</h2>
          <p>{{ residence.address }}</p>
          <p>{{ residence.residents }} residentes</p>
        </div>
      </ion-label>
    </ion-item>
    }
  </ion-list>
</ion-content>
